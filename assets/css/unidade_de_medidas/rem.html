    </p>

    <p style="font-size: 3rem;">
        fonte-size: 3em = 48px
    </p>

    <hr><br>

    <div class="exemplo01" style="font-size: 20px; background-color: yellow;">
        font-size: 20px
        <div class="exemplo02" style="font-size: 2rem; background-color: blueviolet;">
            font-size: 2rem = 32px
            <div class="exemplo03" style="font-size: 2rem; background-color: aqua;">
                font-size: 2rem = 48px

        </div>

    <br><hr><br>

    <div class="exemplo02" style="font-size: 30px; width: 10rem; background-color: burlywood;">
        font-size: 30px; <br>
        width: 10em = 160px

</html>
