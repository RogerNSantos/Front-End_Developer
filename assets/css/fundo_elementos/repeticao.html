<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repetição</title>
    <link rel="stylesheet" href="repeticao.css">
</head>
<body>
    <div>
    <code>background-repeat: repeat; </code>
    <div class="exemplo" id="repeat"></div>
    </div>

    <code>background-repeat: repeat-x; </code>
    <div class="exemplo" id="repeat_x"></div>

    <code>background-repeat: repeat-y; </code>
    <div class="exemplo" id="repeat_y"></div>

    <code>background-repeat: space; </code>
    <div class="exemplo" id="space"></div>

    <code>background-repeat: round; </code>
    <div class="exemplo" id="round"></div>

    <code>background-repeat: no-repeat; </code>
    <div class="exemplo" id="no_repeat"></div>

    <code>background-repeat: valor valor; </code>
    <div class="exemplo" id="valor"></div>
</body>
</html>
