<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redimensionando imagens de fundo dos elementos</title>
    <link rel="stylesheet" href="red_img_dos_elemntos.css">
</head>

<body>
    <code>background-size: auto;</code>
    <div class="exemplo" id="auto"></div>

    <code>background-size: cover;</code>
    <div class="exemplo" id="cover"></div>

    <code>background-size: contain;</code>
    <div class="exemplo" id="contain"></div>

    <code>background-size: valor;</code>
    <div class="exemplo" id="valor"></div>

    <code>background-size: valor-1 valor2;</code>
    <div class="exemplo" id="valor2"></div>

    <code>background-size: camada-1, camada-2;</code>
    <div class="exemplo" id="camada_1"></div>


</body>

</html>
