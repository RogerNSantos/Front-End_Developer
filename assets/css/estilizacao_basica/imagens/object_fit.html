<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object_fit</title>
    <link rel="stylesheet" href="object_fit.css">
</head>
<body>
    <h1>Propriedades <code>object-fit</code></h1>

    <code>object-fit: fill;</code>

    <div>
        <img src="LOGO-DIO-COLOR.png" alt="" id="fill">
    </div>
    <br>
    <code>object-fit: contain;</code>
    
    <div>
        <img src="LOGO-DIO-COLOR.png" alt="" id="contain">
    </div>
    <br>

    <code>object-fit: cover;</code>
    <div>
        <img src="LOGO-DIO-COLOR.png" alt="" id="cover">
    </div>

    <br>

    <code>object-fit: none;</code>
    <div>
        <img src="LOGO-DIO-COLOR.png" alt="" id="none">
    </div>

    <br>

    <code>object-fit: scale-down;</code>
    <div>
        <img src="LOGO-DIO-COLOR.png" alt="" id="scale-sown">
    </div>
</body>
</html>
