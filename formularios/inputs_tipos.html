<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs e tipos</title>
</head>

<body>
    <form>
        <label>Nome: </label><input type="text" id="nome"><br>
        <label>Numero: </label><input type="number" id="numero" min="0" step="3" max="100"><br>

        <label>Ranger: </label><input type="range" id="ranger" value="BarraEnviar" min="0 max="5"><br>
        <label>Cor: </label><input type="color"><br>
        <label>Url: </label><input type="url"><br>
        <label>E-mail: </label><input type="email" ><br>
        <label>Data: </label><input type="date" ><br>
        <label>Semana: </label><input type="week" ><br>
        <label>Mês: </label><input type="month" ><br>
        <label>Arquivo: </label><input type="file"  multiple><br>
        <label>Hiddne: </label><input type="hidden" value="Valor oculto"><br><br>
        <label>Pesquisar: </label><input type="search"><br><br>
        <label>Enviar: </label><input type="submit" value="Enviar"><br>
        <label>Limpar: </label><input type="reset" value="Limpar"><br>

        

    </form>
</body>

</html>
