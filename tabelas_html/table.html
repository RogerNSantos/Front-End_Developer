<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela table</title>
</head>
<body>
    <table summary="Tabela de informações" border="1" width="350" cellspacing="5" cellpadding="5" align="center"> <!-- Tabela -->
        <tr> <!-- Linha -->
            <td>Nome</td><!-- Coluna -->
            <td>Idade</td><!-- Coluna -->
        </tr>
        <tr>
            <td>João</td>
            <td>25</td>
        </tr>
    </table>
</body>
</html>
