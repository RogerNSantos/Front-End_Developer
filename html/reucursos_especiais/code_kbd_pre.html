<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code, kbd e pre </title>
    <style>
        kbd{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <p>Para copiar esta informação, pressione <kbd>CTRL</kbd> + <kbd>C</kbd></p>

    <p>Utilizar <code>background-color</code> para mudar o fundo do elemento.</p>

    <pre>
        kbd{
            border: 1px solid black;
        }
    </pre>
</body>
</html>
