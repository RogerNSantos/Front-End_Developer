<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha tr</title>

    <style>
        table tr:nth-child(even){
            background-color: #f2f2f2;
        }
        table tr:hover td{
            background-color: #ddd;
        }
    </style>

</head>
<body>
    <table summary="Tabela de informações" border="1" width="350" cellspacing="5" cellpadding="5" align="center"> <!-- Tabela -->
        <tr> <!-- Linha -->
            <td>Nome</td><!-- Coluna -->
            <td>Idade</td><!-- Coluna -->
        </tr>
        <tr>
            <td>João</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Victor</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Teste</td>
            <td>52</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>28</td>
        </tr>
    </table>
</body>
</html>
