<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas ordenadas e não ordenadas</h1>

    <p>Lista ordenada</p>
    <ol>
        <li>Banana</li>
        <li>Pera</li>
        <li>Maça</li>
        <li>Uva</li>
        <li>
            <ol>
                <li>Item 2</li>
                <li>Item 3</li>
                <li>Item 4</li>

            </ol>
        </li>
    </ol>

    <p>Lista não ordenada</p>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>
            <ul>
                <li>Sub item 2</li>
                <li>Sub item 3</li>
                <li>Sub item 4</li>
            </ul>
        </li>
    </ul>
</body>
</html>
